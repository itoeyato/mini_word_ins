<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
    <title>Poster Editor Pro — Plano de Corte Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0f14;
            --surface: #111820;
            --surface2: #181f2a;
            --border: #263040;
            --accent: #5eead4;
            --accent2: #f0b27a;
            --text: #e9ecef;
            --muted: #7f8c9a;
            --danger: #f87171;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --radius: 10px;
            --transition: 0.2s ease;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            background-image: radial-gradient(circle at 20% 20%, #1a2533 1px, transparent 1px);
            background-size: 32px 32px;
            min-height: 100vh;
            padding: 20px 16px 40px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-icon {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: -4px;
        }
        .panel-header span {
            background: var(--accent);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 2px;
            display: block;
        }
        input[type="number"],
        select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: var(--transition);
            outline: none;
        }
        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.15);
        }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .row>div {
            flex: 1;
            min-width: 80px;
        }
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            transition: var(--transition);
        }
        .chip.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(94, 234, 212, 0.08);
        }
        .chip:hover:not(.active) {
            border-color: #4b5563;
            color: #d1d5db;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-group button {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }
        .btn-group button.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(94, 234, 212, 0.08);
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
        .slider-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-item label {
            width: 70px;
            margin: 0;
            font-size: 0.75rem;
        }
        .slider-item input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }
        .slider-item span {
            width: 36px;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
        canvas#preview {
            width: 100%;
            border-radius: 6px;
            background: #050a10;
            border: 1px solid var(--border);
        }
        .dims-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .dims-grid div span {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--muted);
        }
        .dims-grid div {
            color: var(--accent);
        }
        .warn-box {
            padding: 10px;
            border: 1px solid var(--danger);
            border-radius: 6px;
            color: var(--danger);
            font-size: 0.8rem;
            background: rgba(248, 113, 113, 0.08);
            display: none;
        }
        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #0a1a1a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary:hover {
            background: #34d399;
        }
        .btn-primary:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-secondary:hover {
            background: rgba(94, 234, 212, 0.06);
        }
        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .status-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .theme-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .theme-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .theme-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 440px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        .theme-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
        }
        .theme-card:hover {
            border-color: var(--accent);
        }
        .theme-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.2);
        }
        .swatch-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .swatch-row span {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }
        @media (max-width: 400px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo"><h1>PosterEditor Pro</h1></div>
            <div class="toolbar">
                <button class="btn-icon" id="undoBtn" title="Deshacer (Ctrl+Z)" disabled>↶</button>
                <button class="btn-icon" id="redoBtn" title="Rehacer (Ctrl+Y)" disabled>↷</button>
                <button class="btn-icon" id="themeBtn" title="Temas">🎨</button>
            </div>
        </header>

        <!-- Imagen -->
        <div class="panel">
            <div class="panel-header"><span></span> Imagen</div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <input type="file" id="fileInput" accept="image/*" style="flex:1; min-width:140px;">
                <button class="btn-icon" id="cameraBtn" title="Usar cámara">📷</button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button id="rotateBtn" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:0.85rem;">🔄 Rotar 90°</button>
                <span id="rotationLabel" style="font-size:0.8rem;color:var(--muted);">0°</span>
            </div>
        </div>

        <!-- Papel -->
        <div class="panel">
            <div class="panel-header"><span></span> Papel y orientación</div>
            <select id="paperType">
                <option value="carta">Carta (21.6 × 27.9 cm)</option>
                <option value="oficio">Oficio (21.6 × 34 cm)</option>
                <option value="legal">Legal US (21.6 × 35.6 cm)</option>
                <option value="a4">A4 (21.0 × 29.7 cm)</option>
                <option value="a3">A3 (29.7 × 42.0 cm)</option>
                <option value="a2">A2 (42.0 × 59.4 cm)</option>
                <option value="tabloide">Tabloide (27.9 × 43.2 cm)</option>
                <option value="10x15">10 × 15 cm</option>
                <option value="custom">Personalizado</option>
            </select>
            <div class="row" id="customPaperRow" style="display:none;">
                <div><label>Ancho (cm)</label><input type="number" id="paperW" value="21.6" step="0.1"></div>
                <div><label>Alto (cm)</label><input type="number" id="paperH" value="27.9" step="0.1"></div>
            </div>
            <div class="btn-group" id="orientGroup">
                <button id="orientA" class="active">Auto</button>
                <button id="orientV">Vertical</button>
                <button id="orientH">Horizontal</button>
            </div>
            <div class="row">
                <div><label>Margen impresora (cm)</label><input type="number" id="printerMargin" value="0.5" step="0.1"></div>
                <div><label>Traslape (cm)</label><input type="number" id="overlap" value="0" step="0.1"></div>
            </div>
        </div>

        <!-- División -->
        <div class="panel">
            <div class="panel-header"><span></span> División del póster</div>
            <div class="btn-group" id="modeGroup">
                <button id="modeManual" class="active">Manual</button>
                <button id="modeDesired">Por tamaño final</button>
                <button id="modeExact">Hojas exactas</button>
            </div>
            <div id="manualMode">
                <div class="chips" id="presetChips">
                    <div class="chip" data-c="1" data-r="2">1×2</div>
                    <div class="chip" data-c="2" data-r="1">2×1</div>
                    <div class="chip active" data-c="2" data-r="2">2×2</div>
                    <div class="chip" data-c="2" data-r="3">2×3</div>
                    <div class="chip" data-c="3" data-r="2">3×2</div>
                    <div class="chip" data-c="3" data-r="3">3×3</div>
                    <div class="chip" data-c="3" data-r="4">3×4</div>
                    <div class="chip" data-c="4" data-r="3">4×3</div>
                    <div class="chip" data-c="4" data-r="4">4×4</div>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="optimizeGridCheck">
                    <label for="optimizeGridCheck">Optimizar automáticamente (máx. hojas)</label>
                </div>
                <div id="optimizeSettings" style="display:none;">
                    <label>Máximo de hojas</label>
                    <input type="number" id="maxSheets" value="9" min="1" step="1">
                    <div id="optimalInfo" style="font-size:0.75rem;color:var(--accent);margin-top:4px;"></div>
                </div>
                <div id="manualGridInputs" class="row">
                    <div><label>Columnas</label><input type="number" id="cols" value="2" min="1"></div>
                    <div><label>Filas</label><input type="number" id="rows" value="2" min="1"></div>
                </div>
            </div>
            <div id="desiredMode" style="display:none;">
                <div class="row">
                    <div><label>Ancho deseado (cm)</label><input type="number" id="desiredW" value="60" step="0.1"></div>
                    <div><label>Alto deseado (cm)</label><input type="number" id="desiredH" value="40" step="0.1"></div>
                </div>
            </div>
            <div id="exactMode" style="display:none;">
                <label>Número exacto de hojas</label>
                <input type="number" id="exactSheets" value="6" min="1" step="1">
                <div id="exactInfo" style="font-size:0.75rem;color:var(--accent);margin-top:4px;"></div>
            </div>
        </div>

        <!-- Recorte y calidad -->
        <div class="panel">
            <div class="panel-header"><span></span> Recorte y calidad</div>
            <div class="slider-item"><label>Izquierda</label><input type="range" id="cropLeft" min="0" max="50" value="0" step="1"><span id="cropLeftVal">0%</span></div>
            <div class="slider-item"><label>Derecha</label><input type="range" id="cropRight" min="0" max="50" value="0" step="1"><span id="cropRightVal">0%</span></div>
            <div class="slider-item"><label>Superior</label><input type="range" id="cropTop" min="0" max="50" value="0" step="1"><span id="cropTopVal">0%</span></div>
            <div class="slider-item"><label>Inferior</label><input type="range" id="cropBottom" min="0" max="50" value="0" step="1"><span id="cropBottomVal">0%</span></div>
            <div class="row">
                <div><label>Calidad</label><select id="quality"><option value="100">Borrador (100 DPI)</option><option value="150" selected>Normal (150 DPI)</option><option value="300">Alta (300 DPI)</option></select></div>
                <div style="display:flex; flex-direction:column; gap:8px; justify-content:flex-end;">
                    <div class="checkbox-item"><input type="checkbox" id="cropMarksCheck" checked><label for="cropMarksCheck">Marcas de corte</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="draftModeCheck"><label for="draftModeCheck">Escala de grises</label></div>
                </div>
            </div>
        </div>

        <!-- Vista previa -->
        <div class="panel">
            <div class="panel-header"><span></span> Vista previa</div>
            <canvas id="preview" width="800" height="500"></canvas>
            <div class="dims-grid" id="dimsOut"></div>
            <div class="warn-box" id="warnBox"></div>
        </div>

        <button class="btn-primary" id="generateBtn" disabled>📥 Exportar PDF</button>
        <button class="btn-secondary" id="printBtn" disabled>🖨️ Imprimir</button>
        <div class="status-text" id="statusLine"></div>
    </div>

    <!-- Overlay de temas -->
    <div class="theme-overlay" id="themeOverlay">
        <div class="theme-panel">
            <h3 style="margin:0 0 6px;">🎨 Elegí un tema</h3>
            <p style="font-size:0.8rem;color:var(--muted);">Se guarda automáticamente.</p>
            <div class="theme-grid" id="themeGrid"></div>
            <button id="closeThemeBtn" style="width:100%;margin-top:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;cursor:pointer;">Cerrar</button>
        </div>
    </div>

    <script>
        (function() {
            const THEMES = {
                'Midnight Tech': { bg: '#0a0f14', surface: '#111820', surface2: '#181f2a', border: '#263040',
                    accent: '#5eead4', accent2: '#f0b27a', text: '#e9ecef', muted: '#7f8c9a', danger: '#f87171' },
                'Forest Moss': { bg: '#0f1a0e', surface: '#162516', surface2: '#1a2e1a', border: '#2a4428',
                    accent: '#7bc67e', accent2: '#c9a96e', text: '#e6efe3', muted: '#7d9a78', danger: '#e0554a' },
                'Sunset Warm': { bg: '#1f1710', surface: '#2b1f16', surface2: '#33251a', border: '#4a3424',
                    accent: '#f0985c', accent2: '#f5c26b', text: '#fbf0e3', muted: '#b8937a', danger: '#e85d4a' },
                'Ocean Depths': { bg: '#08111f', surface: '#0b1a30', surface2: '#0e1f3a', border: '#1a3255',
                    accent: '#5b9bd5', accent2: '#e8a87c', text: '#dee8f2', muted: '#6b8db5', danger: '#e06055' },
                'Lavender Haze': { bg: '#15101f', surface: '#1f182e', surface2: '#241c35', border: '#382d50',
                    accent: '#b39ddb', accent2: '#f0b87d', text: '#e8e0f3', muted: '#8e7db5', danger: '#e06055' },
                'Mono Steel': { bg: '#14181c', surface: '#1c2126', surface2: '#21272d', border: '#333b42',
                    accent: '#9eacb8', accent2: '#c4a87c', text: '#e8ecef', muted: '#7d8893', danger: '#d97060' },
                'Crimson Night': { bg: '#1b0e10', surface: '#291518', surface2: '#321a1d', border: '#4a2529',
                    accent: '#e8787f', accent2: '#f0b87d', text: '#f5e3e4', muted: '#b87b80', danger: '#ff5c4a' },
                'Mint Cream': { bg: '#0f1a16', surface: '#15261f', surface2: '#192e26', border: '#264538',
                    accent: '#6eccaf', accent2: '#e0b87d', text: '#e3f0ea', muted: '#6e9b87', danger: '#e06050' },
                'Amber Glow': { bg: '#1b1508', surface: '#2a200e', surface2: '#332712', border: '#4a351a',
                    accent: '#f5c26b', accent2: '#f0985c', text: '#fdf3e0', muted: '#b89a60', danger: '#e05845' },
                'Arctic Frost': { bg: '#0d1418', surface: '#141e24', surface2: '#18252c', border: '#263840',
                    accent: '#a3d9f0', accent2: '#f0c88a', text: '#e6f0f5', muted: '#7a9bab', danger: '#e06555' },
                'Rose Gold': { bg: '#1b1315', surface: '#2a1c20', surface2: '#332226', border: '#4a3035',
                    accent: '#e8b4b8', accent2: '#e8c890', text: '#f5e8ea', muted: '#b88a8f', danger: '#e06050' },
                'Cyber Neon': { bg: '#0a0a12', surface: '#10101f', surface2: '#141428', border: '#222244',
                    accent: '#00ffc8', accent2: '#ff6b9d', text: '#e0e0ff', muted: '#7777aa', danger: '#ff4466' }
            };
            const STORAGE_THEME = 'poster-theme-pro';
            const STORAGE_CONFIG = 'poster-config-pro';

            function applyTheme(name) {
                const t = THEMES[name] || THEMES['Midnight Tech'];
                const root = document.documentElement;
                Object.entries(t).forEach(([k, v]) => root.style.setProperty('--' + k, v));
                localStorage.setItem(STORAGE_THEME, name);
            }

            function buildThemeGrid() {
                const grid = document.getElementById('themeGrid');
                const current = localStorage.getItem(STORAGE_THEME) || 'Midnight Tech';
                grid.innerHTML = '';
                Object.keys(THEMES).forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'theme-card';
                    if (name === current) card.classList.add('selected');
                    card.dataset.theme = name;
                    const swRow = document.createElement('div');
                    swRow.className = 'swatch-row';
                    [THEMES[name].accent, THEMES[name].accent2, THEMES[name].surface, THEMES[name].text]
                    .forEach(c => {
                            const s = document.createElement('span');
                            s.style.background = c;
                            swRow.appendChild(s);
                        });
                    const nm = document.createElement('div');
                    nm.textContent = name;
                    nm.style.fontSize = '0.7rem';
                    nm.style.fontWeight = '600';
                    card.appendChild(swRow);
                    card.appendChild(nm);
                    card.addEventListener('click', () => {
                        applyTheme(name);
                        buildThemeGrid();
                    });
                    grid.appendChild(card);
                });
            }
            applyTheme(localStorage.getItem(STORAGE_THEME) || 'Midnight Tech');
            buildThemeGrid();

            const themeOverlay = document.getElementById('themeOverlay');
            document.getElementById('themeBtn').addEventListener('click', () => themeOverlay.classList.add(
                'open'));
            document.getElementById('closeThemeBtn').addEventListener('click', () => themeOverlay.classList.remove(
                'open'));

            // ────────── Estado ──────────
            const state = { img: null, originalImg: null, imgW: 0, imgH: 0, rotation: 0 };
            const $ = id => document.getElementById(id);
            const els = {
                fileInput: $('fileInput'),
                cameraInput: $('cameraInput'),
                cameraBtn: $('cameraBtn'),
                rotateBtn: $('rotateBtn'),
                rotationLabel: $('rotationLabel'),
                paperType: $('paperType'),
                customPaperRow: $('customPaperRow'),
                paperW: $('paperW'),
                paperH: $('paperH'),
                orientA: $('orientA'),
                orientV: $('orientV'),
                orientH: $('orientH'),
                modeManual: $('modeManual'),
                modeDesired: $('modeDesired'),
                modeExact: $('modeExact'),
                manualMode: $('manualMode'),
                desiredMode: $('desiredMode'),
                exactMode: $('exactMode'),
                cols: $('cols'),
                rows: $('rows'),
                presetChips: $('presetChips'),
                optimizeCheck: $('optimizeGridCheck'),
                maxSheets: $('maxSheets'),
                optimizeSettings: $('optimizeSettings'),
                manualInputs: $('manualGridInputs'),
                optimalInfo: $('optimalInfo'),
                exactInfo: $('exactInfo'),
                desiredW: $('desiredW'),
                desiredH: $('desiredH'),
                exactSheets: $('exactSheets'),
                printerMargin: $('printerMargin'),
                overlap: $('overlap'),
                cropMarksCheck: $('cropMarksCheck'),
                draftModeCheck: $('draftModeCheck'),
                quality: $('quality'),
                cropLeft: $('cropLeft'),
                cropRight: $('cropRight'),
                cropTop: $('cropTop'),
                cropBottom: $('cropBottom'),
                canvas: $('preview'),
                dimsOut: $('dimsOut'),
                warnBox: $('warnBox'),
                generateBtn: $('generateBtn'),
                printBtn: $('printBtn'),
                statusLine: $('statusLine'),
                undoBtn: $('undoBtn'),
                redoBtn: $('redoBtn')
            };
            const ctx = els.canvas.getContext('2d');

            let orientation = 'auto',
                calcMode = 'manual';
            const PAPERS = { carta: [21.6, 27.9], oficio: [21.6, 34], legal: [21.6, 35.6], a4: [21.0, 29.7], a3: [29.7,
                    42.0
                ], a2: [42.0, 59.4], tabloide: [27.9, 43.2], '10x15': [10, 15] };

            // Historial
            const history = { stack: [], index: -1, busy: false };

            function getStateObj() {
                return {
                    paperType: els.paperType.value,
                    paperW: els.paperW.value,
                    paperH: els.paperH.value,
                    orientation,
                    calcMode,
                    cols: els.cols.value,
                    rows: els.rows.value,
                    optimize: els.optimizeCheck.checked,
                    maxSheets: els.maxSheets.value,
                    desiredW: els.desiredW.value,
                    desiredH: els.desiredH.value,
                    exactSheets: els.exactSheets.value,
                    printerMargin: els.printerMargin.value,
                    overlap: els.overlap.value,
                    cropMarks: els.cropMarksCheck.checked,
                    draft: els.draftModeCheck.checked,
                    quality: els.quality.value,
                    cropL: els.cropLeft.value,
                    cropR: els.cropRight.value,
                    cropT: els.cropTop.value,
                    cropB: els.cropBottom.value,
                    rotation: state.rotation
                };
            }

            function pushState() {
                if (history.busy) return;
                const s = getStateObj();
                if (history.index >= 0 && JSON.stringify(history.stack[history.index]) === JSON.stringify(s))
            return;
                history.stack = history.stack.slice(0, history.index + 1);
                history.stack.push(s);
                history.index++;
                localStorage.setItem(STORAGE_CONFIG, JSON.stringify(s));
                updateHistoryUI();
            }

            function applyState(s) {
                history.busy = true;
                els.paperType.value = s.paperType;
                els.customPaperRow.style.display = s.paperType === 'custom' ? 'flex' : 'none';
                els.paperW.value = s.paperW;
                els.paperH.value = s.paperH;
                orientation = s.orientation;
                ['orientA', 'orientV', 'orientH'].forEach(id => els[id].classList.remove('active'));
                els['orient' + { auto: 'A', vertical: 'V', horizontal: 'H' } [orientation]].classList.add('active');
                calcMode = s.calcMode || 'manual';
                ['modeManual', 'modeDesired', 'modeExact'].forEach(id => els[id].classList.remove('active'));
                els['mode' + { manual: 'Manual', desired: 'Desired', exact: 'Exact' } [calcMode]].classList.add(
                'active');
                els.manualMode.style.display = calcMode === 'manual' ? 'block' : 'none';
                els.desiredMode.style.display = calcMode === 'desired' ? 'block' : 'none';
                els.exactMode.style.display = calcMode === 'exact' ? 'block' : 'none';
                els.cols.value = s.cols;
                els.rows.value = s.rows;
                els.desiredW.value = s.desiredW || 60;
                els.desiredH.value = s.desiredH || 40;
                els.exactSheets.value = s.exactSheets || 6;
                els.optimizeCheck.checked = s.optimize || false;
                els.maxSheets.value = s.maxSheets || 9;
                els.optimizeSettings.style.display = els.optimizeCheck.checked ? 'block' : 'none';
                els.manualInputs.style.display = els.optimizeCheck.checked ? 'none' : 'block';
                updateChipActive(s.cols, s.rows);
                els.printerMargin.value = s.printerMargin;
                els.overlap.value = s.overlap;
                els.cropMarksCheck.checked = s.cropMarks !== undefined ? s.cropMarks : true;
                els.draftModeCheck.checked = s.draft || false;
                els.quality.value = s.quality;
                els.cropLeft.value = s.cropL || 0;
                els.cropRight.value = s.cropR || 0;
                els.cropTop.value = s.cropT || 0;
                els.cropBottom.value = s.cropB || 0;
                updateCropLabels();
                if (s.rotation !== undefined && s.rotation !== state.rotation) {
                    state.rotation = s.rotation;
                    applyRotationToImage().then(() => {
                        els.rotationLabel.textContent = (state.rotation || 0) + '°';
                        render();
                    });
                } else {
                    render();
                }
                history.busy = false;
                updateHistoryUI();
            }

            function updateHistoryUI() { els.undoBtn.disabled = history.index <= 0;
                els.redoBtn.disabled = history.index >= history.stack.length - 1; }

            function undo() { if (history.index > 0) { history.index--;
                    applyState(history.stack[history.index]); } }

            function redo() { if (history.index < history.stack.length - 1) { history.index++;
                    applyState(history.stack[history.index]); } }

            const saved = JSON.parse(localStorage.getItem(STORAGE_CONFIG) || 'null');
            if (saved) { applyState(saved);
                history.stack = [saved];
                history.index = 0; } else pushState();

            els.undoBtn.addEventListener('click', undo);
            els.redoBtn.addEventListener('click', redo);
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault();
                    undo(); } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e
                        .key.toLowerCase() === 'z'))) { e.preventDefault();
                    redo(); }
            });

            // Carga de imagen
            els.cameraBtn.addEventListener('click', () => els.cameraInput.click());
            els.cameraInput.addEventListener('change', e => loadImage(e.target.files[0]));
            els.fileInput.addEventListener('change', e => loadImage(e.target.files[0]));

            function loadImage(file) {
                if (!file) return;
                const img = new Image();
                img.onload = () => {
                    state.originalImg = img;
                    state.rotation = 0;
                    state.img = img;
                    state.imgW = img.naturalWidth;
                    state.imgH = img.naturalHeight;
                    els.rotationLabel.textContent = '0°';
                    els.generateBtn.disabled = false;
                    els.printBtn.disabled = false;
                    render();
                    pushState();
                };
                img.src = URL.createObjectURL(file);
            }

            // Rotación corregida con Promesas
            function applyRotationToImage() {
                return new Promise(resolve => {
                    if (!state.originalImg) return resolve();
                    const rot = state.rotation % 360;
                    if (rot === 0) {
                        state.img = state.originalImg;
                        state.imgW = state.originalImg.naturalWidth;
                        state.imgH = state.originalImg.naturalHeight;
                        resolve();
                    } else {
                        const off = document.createElement('canvas');
                        const ow = state.originalImg.naturalWidth;
                        const oh = state.originalImg.naturalHeight;
                        if (rot === 90 || rot === 270) {
                            off.width = oh;
                            off.height = ow;
                        } else {
                            off.width = ow;
                            off.height = oh;
                        }
                        const octx = off.getContext('2d');
                        octx.translate(off.width / 2, off.height / 2);
                        octx.rotate((rot * Math.PI) / 180);
                        octx.drawImage(state.originalImg, -ow / 2, -oh / 2);
                        const newImg = new Image();
                        newImg.onload = () => {
                            state.img = newImg;
                            state.imgW = off.width;
                            state.imgH = off.height;
                            resolve();
                        };
                        newImg.src = off.toDataURL();
                    }
                });
            }

            els.rotateBtn.addEventListener('click', async () => {
                if (!state.originalImg) return;
                state.rotation = (state.rotation + 90) % 360;
                els.rotationLabel.textContent = state.rotation + '°';
                await applyRotationToImage();
                render();
                pushState();
            });

            // Listeners de UI
            els.paperType.addEventListener('change', () => {
                els.customPaperRow.style.display = els.paperType.value === 'custom' ? 'flex' : 'none';
                render();
                pushState();
            });
            [els.paperW, els.paperH].forEach(el => { el.addEventListener('input', render);
                el.addEventListener('change', pushState); });

            function setOrientation(o) {
                orientation = o;
                ['orientA', 'orientV', 'orientH'].forEach(id => els[id].classList.remove('active'));
                els['orient' + { auto: 'A', vertical: 'V', horizontal: 'H' } [o]].classList.add('active');
                render();
                pushState();
            }
            els.orientA.addEventListener('click', () => setOrientation('auto'));
            els.orientV.addEventListener('click', () => setOrientation('vertical'));
            els.orientH.addEventListener('click', () => setOrientation('horizontal'));

            function setCalcMode(m) {
                calcMode = m;
                ['modeManual', 'modeDesired', 'modeExact'].forEach(id => els[id].classList.remove('active'));
                els['mode' + { manual: 'Manual', desired: 'Desired', exact: 'Exact' } [m]].classList.add('active');
                els.manualMode.style.display = m === 'manual' ? 'block' : 'none';
                els.desiredMode.style.display = m === 'desired' ? 'block' : 'none';
                els.exactMode.style.display = m === 'exact' ? 'block' : 'none';
                render();
                pushState();
            }
            els.modeManual.addEventListener('click', () => setCalcMode('manual'));
            els.modeDesired.addEventListener('click', () => setCalcMode('desired'));
            els.modeExact.addEventListener('click', () => setCalcMode('exact'));

            els.presetChips.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    els.cols.value = chip.dataset.c;
                    els.rows.value = chip.dataset.r;
                    updateChipActive(chip.dataset.c, chip.dataset.r);
                    render();
                    pushState();
                });
            });

            function updateChipActive(c, r) {
                els.presetChips.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset
                    .c === String(c) && ch.dataset.r === String(r)));
            }

            [els.cols, els.rows, els.desiredW, els.desiredH, els.exactSheets, els.printerMargin, els.overlap, els
                .quality
            ].forEach(el => {
                el.addEventListener('input', () => {
                    if (el === els.cols || el === els.rows) updateChipActive(els.cols.value, els.rows
                        .value);
                    render();
                });
                el.addEventListener('change', pushState);
            });
            [els.cropMarksCheck, els.draftModeCheck].forEach(el => { el.addEventListener('change', () => { render();
                    pushState(); }); });
            [els.cropLeft, els.cropRight, els.cropTop, els.cropBottom].forEach(el => {
                el.addEventListener('input', () => { updateCropLabels();
                    render(); });
                el.addEventListener('change', pushState);
            });

            function updateCropLabels() {
                document.getElementById('cropLeftVal').textContent = els.cropLeft.value + '%';
                document.getElementById('cropRightVal').textContent = els.cropRight.value + '%';
                document.getElementById('cropTopVal').textContent = els.cropTop.value + '%';
                document.getElementById('cropBottomVal').textContent = els.cropBottom.value + '%';
            }

            els.optimizeCheck.addEventListener('change', () => {
                els.optimizeSettings.style.display = els.optimizeCheck.checked ? 'block' : 'none';
                els.manualInputs.style.display = els.optimizeCheck.checked ? 'none' : 'block';
                render();
                pushState();
            });
            els.maxSheets.addEventListener('input', () => { render();
                pushState(); });

            // ────────── Cálculos profesionales ──────────
            function getPaper(orient) {
                let w, h;
                if (els.paperType.value === 'custom') { w = parseFloat(els.paperW.value) || 21.6;
                    h = parseFloat(els.paperH.value) || 27.9; } else [w, h] = PAPERS[els.paperType.value] || [21.6,
                    27.9
                ];
                if (orient === 'horizontal')[w, h] = [h, w];
                return { w, h };
            }

            function calcOrientation(orient, cols, rows, overlap, margin, aspect) {
                const paper = getPaper(orient === 'auto' ? 'vertical' : orient);
                const pw = paper.w - 2 * margin,
                    ph = paper.h - 2 * margin;
                const effW = pw - (cols > 1 ? overlap : 0),
                    effH = ph - (rows > 1 ? overlap : 0);
                if (effW <= 0 || effH <= 0) return null;
                const totalW = cols * effW,
                    totalH = rows * effH;
                const scale = Math.min(totalW / aspect, totalH);
                const Wf = scale * aspect,
                    Hf = scale;
                return { paper, printableW: pw, printableH: ph, Wf, Hf, area: Wf * Hf, cols, rows, totalW, totalH };
            }

            function findOptimal(maxSheets) {
                if (!state.img) return null;
                const overlap = parseFloat(els.overlap.value) || 0,
                    margin = parseFloat(els.printerMargin.value) || 0;
                const cL = parseFloat(els.cropLeft.value) / 100,
                    cR = parseFloat(els.cropRight.value) / 100,
                    cT = parseFloat(els.cropTop.value) / 100,
                    cB = parseFloat(els.cropBottom.value) / 100;
                const effW = state.imgW * (1 - cL - cR),
                    effH = state.imgH * (1 - cT - cB);
                const aspect = effW / effH;
                const candidates = [];
                for (let c = 1; c <= maxSheets; c++) {
                    for (let r = 1; r <= maxSheets; r++) {
                        if (c * r > maxSheets) continue;
                        let result;
                        if (orientation === 'auto') {
                            const v = calcOrientation('vertical', c, r, overlap, margin, aspect);
                            const h = calcOrientation('horizontal', c, r, overlap, margin, aspect);
                            if (!v && !h) continue;
                            result = h && (!v || h.area > v.area) ? h : v;
                        } else {
                            result = calcOrientation(orientation, c, r, overlap, margin, aspect);
                        }
                        if (result) candidates.push(result);
                    }
                }
                if (candidates.length === 0) return null;
                let maxArea = 0;
                candidates.forEach(c => { if (c.area > maxArea) maxArea = c.area; });
                const threshold = maxArea * 0.95;
                const good = candidates.filter(c => c.area >= threshold);
                good.sort((a, b) => (a.cols * a.rows) - (b.cols * b.rows) || b.area - a.area);
                return good[0];
            }

            function findExact(N) {
                const overlap = parseFloat(els.overlap.value) || 0,
                    margin = parseFloat(els.printerMargin.value) || 0;
                const cL = parseFloat(els.cropLeft.value) / 100,
                    cR = parseFloat(els.cropRight.value) / 100,
                    cT = parseFloat(els.cropTop.value) / 100,
                    cB = parseFloat(els.cropBottom.value) / 100;
                const effW = state.img ? state.imgW * (1 - cL - cR) : 100;
                const effH = state.img ? state.imgH * (1 - cT - cB) : 100;
                const aspect = effW / effH;
                let best = null;
                for (let c = 1; c <= N; c++) {
                    if (N % c === 0) {
                        const r = N / c;
                        let result;
                        if (orientation === 'auto') {
                            const v = calcOrientation('vertical', c, r, overlap, margin, aspect);
                            const h = calcOrientation('horizontal', c, r, overlap, margin, aspect);
                            if (!v && !h) continue;
                            result = h && (!v || h.area > v.area) ? h : v;
                        } else {
                            result = calcOrientation(orientation, c, r, overlap, margin, aspect);
                        }
                        if (result && (!best || result.area > best.area)) best = result;
                    }
                }
                return best;
            }

            function computeLayout() {
                const overlap = parseFloat(els.overlap.value) || 0,
                    margin = parseFloat(els.printerMargin.value) || 0;
                const cL = parseFloat(els.cropLeft.value) / 100,
                    cR = parseFloat(els.cropRight.value) / 100,
                    cT = parseFloat(els.cropTop.value) / 100,
                    cB = parseFloat(els.cropBottom.value) / 100;
                const scaleX = 1 - cL - cR,
                    scaleY = 1 - cT - cB;
                const effW = state.img ? state.imgW * scaleX : 100;
                const effH = state.img ? state.imgH * scaleY : 100;
                const aspect = effW / effH;
                let cols, rows, result;

                if (calcMode === 'desired') {
                    const dw = parseFloat(els.desiredW.value) || 60,
                        dh = parseFloat(els.desiredH.value) || 40;
                    const paper = getPaper(orientation === 'auto' ? 'vertical' : orientation);
                    const pw = paper.w - 2 * margin,
                        ph = paper.h - 2 * margin;
                    const ew = pw - overlap,
                        eh = ph - overlap;
                    if (ew <= 0 || eh <= 0) return null;
                    cols = Math.max(1, Math.ceil(dw / ew));
                    rows = Math.max(1, Math.ceil(dh / eh));
                } else if (calcMode === 'exact') {
                    const N = parseInt(els.exactSheets.value) || 6;
                    const best = findExact(N);
                    if (best) {
                        els.cols.value = best.cols;
                        els.rows.value = best.rows;
                        updateChipActive(best.cols, best.rows);
                        els.exactInfo.textContent =
                            `Mejor ajuste: ${best.cols}×${best.rows} (${best.cols*best.rows} hojas)`;
                        return buildResult(best, overlap, margin, cL, cR, cT, cB, scaleX, scaleY);
                    } else {
                        els.exactInfo.textContent = 'No se encontró ajuste exacto.';
                        cols = parseInt(els.cols.value) || 2;
                        rows = parseInt(els.rows.value) || 3;
                    }
                } else if (calcMode === 'manual' && els.optimizeCheck.checked) {
                    const maxS = parseInt(els.maxSheets.value) || 9;
                    const best = findOptimal(maxS);
                    if (best) {
                        els.cols.value = best.cols;
                        els.rows.value = best.rows;
                        updateChipActive(best.cols, best.rows);
                        els.optimalInfo.textContent =
                            `Óptimo: ${best.cols}×${best.rows} (${best.cols*best.rows} hojas)`;
                        return buildResult(best, overlap, margin, cL, cR, cT, cB, scaleX, scaleY);
                    } else {
                        els.optimalInfo.textContent = 'No se encontró óptimo.';
                        cols = parseInt(els.cols.value) || 1;
                        rows = parseInt(els.rows.value) || 1;
                    }
                } else {
                    els.optimalInfo.textContent = '';
                    els.exactInfo.textContent = '';
                    cols = Math.max(1, parseInt(els.cols.value) || 1);
                    rows = Math.max(1, parseInt(els.rows.value) || 1);
                }

                if (!result) {
                    if (orientation === 'auto') {
                        const v = calcOrientation('vertical', cols, rows, overlap, margin, aspect);
                        const h = calcOrientation('horizontal', cols, rows, overlap, margin, aspect);
                        if (!v && !h) return null;
                        result = h && (!v || h.area > v.area) ? h : v;
                    } else {
                        result = calcOrientation(orientation, cols, rows, overlap, margin, aspect);
                    }
                }
                if (!result) return null;
                return buildResult(result, overlap, margin, cL, cR, cT, cB, scaleX, scaleY);
            }

            function buildResult(r, overlap, margin, cL, cR, cT, cB, scaleX, scaleY) {
                const nomW = r.Wf / r.cols,
                    nomH = r.Hf / r.rows;
                return {
                    ...r,
                    overlap,
                    margin,
                    nomTileW: nomW,
                    nomTileH: nomH,
                    maxTileW: nomW + (r.cols > 1 ? overlap : 0),
                    maxTileH: nomH + (r.rows > 1 ? overlap : 0),
                    cropL: cL,
                    cropR: cR,
                    cropT: cT,
                    cropB: cB,
                    cropScaleX: scaleX,
                    cropScaleY: scaleY
                };
            }

            function render() {
                const L = computeLayout();
                if (!L) {
                    els.warnBox.style.display = 'block';
                    els.warnBox.textContent = 'Ajustes inválidos. Revisá márgenes o traslape.';
                    els.dimsOut.innerHTML = '';
                    els.generateBtn.disabled = true;
                    els.printBtn.disabled = true;
                    return;
                }
                els.warnBox.style.display = 'none';
                if (state.img) { els.generateBtn.disabled = false;
                    els.printBtn.disabled = false; }
                els.dimsOut.innerHTML = `
                    <div><span>Tamaño final</span>${L.Wf.toFixed(1)} × ${L.Hf.toFixed(1)} cm</div>
                    <div><span>Hojas</span>${L.cols*L.rows} (${L.cols}×${L.rows})</div>
                    <div><span>Papel</span>${L.paper.w.toFixed(1)} × ${L.paper.h.toFixed(1)} cm</div>
                    <div><span>Imagen/hoja</span>${L.maxTileW.toFixed(1)} × ${L.maxTileH.toFixed(1)} cm</div>`;

                const gap = Math.max(L.paper.w, L.paper.h) * 0.06;
                const totalW = L.cols * L.paper.w + (L.cols - 1) * gap;
                const totalH = L.rows * L.paper.h + (L.rows - 1) * gap;
                const cw = els.canvas.clientWidth || 360;
                els.canvas.width = cw * 2;
                els.canvas.height = (cw * 2) * (totalH / totalW);
                ctx.setTransform(2, 0, 0, 2, 0, 0);
                const W = els.canvas.width / 2,
                    H = els.canvas.height / 2;
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#050a10';
                ctx.fillRect(0, 0, W, H);
                const scale = W / totalW;
                const srcImg = state.img;
                const cropL_px = srcImg ? srcImg.width * L.cropL : 0,
                    cropT_px = srcImg ? srcImg.height * L.cropT : 0;
                const cropW = srcImg ? srcImg.width * L.cropScaleX : 0,
                    cropH = srcImg ? srcImg.height * L.cropScaleY : 0;
                const pxX = srcImg ? cropW / L.Wf : 0,
                    pxY = srcImg ? cropH / L.Hf : 0;
                const draft = els.draftModeCheck.checked,
                    marks = els.cropMarksCheck.checked;

                for (let r = 0; r < L.rows; r++) {
                    for (let c = 0; c < L.cols; c++) {
                        const px = c * (L.paper.w + gap) * scale,
                            py = r * (L.paper.h + gap) * scale;
                        const pw = L.paper.w * scale,
                            ph = L.paper.h * scale;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(px, py, pw, ph);
                        ctx.strokeStyle = '#5eead4';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px, py, pw, ph);
                        const mp = L.margin * scale;
                        ctx.strokeStyle = '#7f8c9a';
                        ctx.setLineDash([3, 3]);
                        ctx.lineWidth = 0.6;
                        ctx.strokeRect(px + mp, py + mp, pw - 2 * mp, ph - 2 * mp);
                        ctx.setLineDash([]);
                        if (srcImg) {
                            const er = c < L.cols - 1 ? L.overlap : 0,
                                eb = r < L.rows - 1 ? L.overlap : 0;
                            const tw = L.nomTileW + er,
                                th = L.nomTileH + eb;
                            const sx = cropL_px + Math.round(c * L.nomTileW * pxX);
                            const sy = cropT_px + Math.round(r * L.nomTileH * pxY);
                            const sw = Math.min(cropW - (sx - cropL_px), Math.round(tw * pxX));
                            const sh = Math.min(cropH - (sy - cropT_px), Math.round(th * pxY));
                            const dx = px + mp + (pw - 2 * mp - tw * scale) / 2;
                            const dy = py + mp + (ph - 2 * mp - th * scale) / 2;
                            ctx.filter = draft ? 'grayscale(1)' : 'none';
                            ctx.drawImage(srcImg, sx, sy, sw, sh, dx, dy, tw * scale, th * scale);
                            ctx.filter = 'none';
                            ctx.strokeStyle = '#f0b27a';
                            ctx.setLineDash([4, 3]);
                            ctx.lineWidth = 1;
                            const nw = L.nomTileW * scale,
                                nh = L.nomTileH * scale;
                            if (er > 0) { ctx.beginPath();
                                ctx.moveTo(dx + nw, dy);
                                ctx.lineTo(dx + nw, dy + th * scale);
                                ctx.stroke(); }
                            if (eb > 0) { ctx.beginPath();
                                ctx.moveTo(dx, dy + nh);
                                ctx.lineTo(dx + tw * scale, dy + nh);
                                ctx.stroke(); }
                            ctx.setLineDash([]);
                            if (marks) {
                                ctx.strokeStyle = '#000';
                                ctx.lineWidth = 1;
                                ctx.setLineDash([]);
                                const ml = 6,
                                    off = 2;
                                const x1 = dx,
                                    y1 = dy,
                                    x2 = dx + tw * scale,
                                    y2 = dy + th * scale;
                                ctx.beginPath();
                                ctx.moveTo(x1 - off, y1);
                                ctx.lineTo(x1 - off - ml, y1);
                                ctx.moveTo(x1, y1 - off);
                                ctx.lineTo(x1, y1 - off - ml);
                                ctx.stroke();
                                ctx.beginPath();
                                ctx.moveTo(x2 + off, y1);
                                ctx.lineTo(x2 + off + ml, y1);
                                ctx.moveTo(x2, y1 - off);
                                ctx.lineTo(x2, y1 - off - ml);
                                ctx.stroke();
                                ctx.beginPath();
                                ctx.moveTo(x1 - off, y2);
                                ctx.lineTo(x1 - off - ml, y2);
                                ctx.moveTo(x1, y2 + off);
                                ctx.lineTo(x1, y2 + off + ml);
                                ctx.stroke();
                                ctx.beginPath();
                                ctx.moveTo(x2 + off, y2);
                                ctx.lineTo(x2 + off + ml, y2);
                                ctx.moveTo(x2, y2 + off);
                                ctx.lineTo(x2, y2 + off + ml);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            async function buildPages(L, dpi, msg) {
                const pxCm = dpi / 2.54;
                const marginPx = Math.round(L.margin * pxCm);
                const srcImg = state.img;
                if (!srcImg) return [];
                const cLpx = srcImg.width * L.cropL,
                    cTpx = srcImg.height * L.cropT;
                const cW = srcImg.width * L.cropScaleX,
                    cH = srcImg.height * L.cropScaleY;
                const pxX = cW / L.Wf,
                    pxY = cH / L.Hf;
                const pageWpx = Math.round(L.paper.w * pxCm),
                    pageHpx = Math.round(L.paper.h * pxCm);
                const total = L.cols * L.rows,
                    pages = [];
                const draft = els.draftModeCheck.checked,
                    marks = els.cropMarksCheck.checked;
                for (let r = 0, pn = 0; r < L.rows; r++) {
                    for (let c = 0; c < L.cols; c++) {
                        pn++;
                        els.statusLine.textContent = `${msg} hoja ${pn}/${total}…`;
                        const er = c < L.cols - 1 ? L.overlap : 0,
                            eb = r < L.rows - 1 ? L.overlap : 0;
                        const tw = L.nomTileW + er,
                            th = L.nomTileH + eb;
                        const sx = cLpx + Math.round(c * L.nomTileW * pxX);
                        const sy = cTpx + Math.round(r * L.nomTileH * pxY);
                        const sw = Math.min(cW - (sx - cLpx), Math.round(tw * pxX));
                        const sh = Math.min(cH - (sy - cTpx), Math.round(th * pxY));
                        const pc = document.createElement('canvas');
                        pc.width = pageWpx;
                        pc.height = pageHpx;
                        const pctx = pc.getContext('2d');
                        pctx.fillStyle = '#fff';
                        pctx.fillRect(0, 0, pageWpx, pageHpx);
                        const twpx = Math.round(tw * pxCm),
                            thpx = Math.round(th * pxCm);
                        const printableW = pageWpx - 2 * marginPx;
                        const printableH = pageHpx - 2 * marginPx;
                        const dx = marginPx + Math.round((printableW - twpx) / 2);
                        const dy = marginPx + Math.round((printableH - thpx) / 2);
                        if (draft) pctx.filter = 'grayscale(1)';
                        pctx.drawImage(srcImg, sx, sy, sw, sh, dx, dy, twpx, thpx);
                        pctx.filter = 'none';
                        if (marks) {
                            const ml = Math.round(pxCm * 0.6),
                                off = Math.round(pxCm * 0.2);
                            pctx.strokeStyle = '#000';
                            pctx.lineWidth = Math.max(1, dpi / 300);
                            pctx.setLineDash([]);
                            pctx.beginPath();
                            pctx.moveTo(dx - off, dy);
                            pctx.lineTo(dx - off - ml, dy);
                            pctx.moveTo(dx, dy - off);
                            pctx.lineTo(dx, dy - off - ml);
                            pctx.stroke();
                            pctx.beginPath();
                            pctx.moveTo(dx + twpx + off, dy);
                            pctx.lineTo(dx + twpx + off + ml, dy);
                            pctx.moveTo(dx + twpx, dy - off);
                            pctx.lineTo(dx + twpx, dy - off - ml);
                            pctx.stroke();
                            pctx.beginPath();
                            pctx.moveTo(dx - off, dy + thpx);
                            pctx.lineTo(dx - off - ml, dy + thpx);
                            pctx.moveTo(dx, dy + thpx + off);
                            pctx.lineTo(dx, dy + thpx + off + ml);
                            pctx.stroke();
                            pctx.beginPath();
                            pctx.moveTo(dx + twpx + off, dy + thpx);
                            pctx.lineTo(dx + twpx + off + ml, dy + thpx);
                            pctx.moveTo(dx + twpx, dy + thpx + off);
                            pctx.lineTo(dx + twpx, dy + thpx + off + ml);
                            pctx.stroke();
                            const cx = dx + twpx / 2,
                                cy = dy + thpx / 2,
                                cl = Math.round(pxCm * 0.3);
                            pctx.strokeStyle = '#f00';
                            pctx.beginPath();
                            pctx.moveTo(cx - cl, cy);
                            pctx.lineTo(cx + cl, cy);
                            pctx.moveTo(cx, cy - cl);
                            pctx.lineTo(cx, cy + cl);
                            pctx.stroke();
                        }
                        pctx.strokeStyle = '#f0b27a';
                        pctx.setLineDash([pxCm * 0.3, pxCm * 0.2]);
                        pctx.lineWidth = Math.max(1, dpi / 150);
                        const nw = Math.round(L.nomTileW * pxCm),
                            nh = Math.round(L.nomTileH * pxCm);
                        if (er > 0) { pctx.beginPath();
                            pctx.moveTo(dx + nw, dy);
                            pctx.lineTo(dx + nw, dy + thpx);
                            pctx.stroke(); }
                        if (eb > 0) { pctx.beginPath();
                            pctx.moveTo(dx, dy + nh);
                            pctx.lineTo(dx + twpx, dy + nh);
                            pctx.stroke(); }
                        pctx.setLineDash([]);
                        pages.push(pc.toDataURL('image/jpeg', 0.93));
                        await new Promise(res => setTimeout(res, 0));
                    }
                }
                return pages;
            }

            els.generateBtn.addEventListener('click', async () => {
                const L = computeLayout();
                if (!state.img || !L) return;
                els.generateBtn.disabled = true;
                const dpi = parseInt(els.quality.value);
                const pages = await buildPages(L, dpi, 'Generando');
                const { jsPDF } = window.jspdf;
                let pdf = null;
                pages.forEach(data => {
                    if (!pdf) pdf = new jsPDF({ unit: 'cm', format: [L.paper.w, L.paper.h] });
                    else pdf.addPage([L.paper.w, L.paper.h]);
                    pdf.addImage(data, 'JPEG', 0, 0, L.paper.w, L.paper.h);
                });
                pdf.save('poster-profesional.pdf');
                els.statusLine.textContent = `✅ Listo — ${pages.length} hojas exportadas.`;
                els.generateBtn.disabled = false;
            });

            els.printBtn.addEventListener('click', async () => {
                const L = computeLayout();
                if (!state.img || !L) return;
                els.printBtn.disabled = true;
                const dpi = parseInt(els.quality.value);
                const pages = await buildPages(L, dpi, 'Preparando impresión');
                const w = window.open('', '_blank');
                w.document.write(
                    `<!DOCTYPE html><html><head><title>Imprimir</title><style>@page{size:${L.paper.w}cm ${L.paper.h}cm;margin:0;}html,body{margin:0;padding:0;}img{width:${L.paper.w}cm;height:${L.paper.h}cm;display:block;page-break-after:always;}img:last-child{page-break-after:auto;}</style></head><body>${pages.map(s => `<img src="${s}">`).join('')}</body></html>`
                    );
                w.document.close();
                w.onload = () => { w.focus();
                    w.print(); };
                els.statusLine.textContent = `🖨️ Enviado a impresión (${pages.length} hojas).`;
                els.printBtn.disabled = false;
            });

            render();
        })();
    </script>
</body>
</html>
